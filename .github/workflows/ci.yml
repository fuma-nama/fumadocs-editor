name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fumadocs-editor/core build
      - run: pnpm -r test
      - run: pnpm -r --filter @fumadocs-editor/core --filter @fumadocs-editor/ui exec tsc --noEmit
      # production build asserts the bundle size budget (scripts/check-size.mjs)
      - run: pnpm --filter playground build
      - run: pnpm --filter @fumadocs-editor/core bench
