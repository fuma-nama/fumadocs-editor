name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      # includes the playground build, which asserts the size budget and
      # chunk layout (apps/playground/scripts/check-size.mjs)
      - name: Build
        run: pnpm build

      - name: Run Tests
        run: pnpm test
